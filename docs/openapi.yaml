openapi: "3.0.3"
info:
  title: Gedai API
  description: |
    API do ecossistema Gedai para gestão de agentes de campo (leituristas)
    das concessionárias de energia do Piauí (PI) e Maranhão (MA).

    ## Autenticação

    A API suporta 3 métodos de autenticação:

    1. **JWT Bearer** — Painel administrativo (`Authorization: Bearer <token>`)
    2. **Telegram TMA** — App do agente (`X-Telegram-Init-Data`)
    3. **API Token (DB)** — Consultas externas/BI via token gerenciável no admin

    Consulte a documentação detalhada em `docs/` para cada módulo.
  version: "2.0.0"
  contact:
    name: Gedai Suporte
    url: https://cenos.com.br
servers:
  - url: http://localhost:3040
    description: Desenvolvimento
tags:
  - name: Health
    description: Endpoints de verificação de saúde
  - name: Público
    description: Rotas públicas (rate limit 60/min)
  - name: Agente
    description: Rotas do app do agente de campo
  - name: Admin
    description: Rotas do painel administrativo
  - name: Consultas
    description: Consultas gerais com token simples
  - name: Tracking
    description: Monitoramento GPS e detecção de quedas
  - name: Service Notes
    description: Notas de Serviço
  - name: Chat
    description: Chat de suporte (socket.io + REST)
  - name: Formulários
    description: Formulários dinâmicos
  - name: Treinamentos
    description: CenEduc e treinamentos interativos
  - name: Badges
    description: Sistema de gamificação
  - name: Notificações
    description: Push, overlay e notificações persistentes
  - name: Config
    description: Configurações do sistema (etapas, feriados)
  - name: App Update
    description: Auto-update Android
paths:
  # ─── HEALTH ────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: Servidor OK
          content:
        application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    example: 10/05/2026, 15:00:00

  # ─── PÚBLICO ──────────────────────────────────────────────────────────
  /public/health:
    get:
      tags: [Público]
      summary: Status do servidor, pools e Redis
      responses:
        "200":
          description: Status detalhado
  /public/calendar:
    get:
      tags: [Público]
      summary: Calendário de eventos por estado/mês
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [pi, ma]
          description: Estado
        - name: month
          in: query
          schema:
            type: string
          description: Mês (YYYY-MM)
      responses:
        "200":
          description: Calendário
  /public/feriados:
    get:
      tags: [Público]
      summary: Feriados do estado
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [pi, ma]
          description: Estado
      responses:
        "200":
          description: Lista de feriados
          content:
        application/json:
              schema:
                type: array
                items:
                  type: string
                  example: 03/04/2026
  /public/metabase_geral:
    get:
      tags: [Público]
      summary: Redirect para dashboard Metabase
      responses:
        "302":
          description: Redirect para Metabase
  /public/generate_token:
    get:
      tags: [Público]
      summary: Gera token de acesso temporário
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
        - name: id
          in: query
          schema:
            type: string
          description: Telegram ID
      responses:
        "200":
          description: Token gerado
  /public/training/{id}:
    get:
      tags: [Público]
      summary: Visualização pública de treinamento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Projeto de treinamento
        "404":
          description: Não encontrado
  /public/form/{id}:
    get:
      tags: [Público]
      summary: Estrutura pública de formulário
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Estrutura do formulário
  /public/form/{id}/check:
    get:
      tags: [Público]
      summary: Verifica se respondente já respondeu
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: respondentId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Status da verificação
  /public/form/submit/{id}:
    post:
      tags: [Público]
      summary: Submete resposta de formulário
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answers:
                  type: object
                metadata:
                  type: object
      responses:
        "201":
          description: Resposta registrada
  /public/form/upload:
    post:
      tags: [Público]
      summary: Upload de arquivo para formulário
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: URL do arquivo
  /public/app_login:
    post:
      tags: [Público]
      summary: Login app nativo (matrícula + PIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                matricula:
                  type: string
                pin:
                  type: string
      responses:
        "200":
          description: Token de acesso
  /public/telegram-webhook:
    post:
      tags: [Público]
      summary: Webhook inbound Telegram
      security:
        - ApiTokenAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Webhook processado
  /public/notify:
    post:
      tags: [Público]
      summary: Notificação pública para agentes
      security:
        - ApiTokenAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicNotifyRequest"
      responses:
        "200":
          description: Notificação enviada
          content:
        application/json:
              schema:
                $ref: "#/components/schemas/PublicNotifyResponse"

  # ─── CONSULTAS (API TOKEN) ────────────────────────────────────────────
  /api/last_update:
    get:
      tags: [Consultas]
      summary: Data da última sincronização
      security:
        - ApiTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/TokenParam"
      responses:
        "200":
          description: Timestamp da última atualização
  /api/pendencias:
    get:
      tags: [Consultas]
      summary: Pendências consolidadas
      security:
        - ApiTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/TokenParam"
        - $ref: "#/components/parameters/StateParam"
      responses:
        "200":
          description: Relatório de pendências
  /api/pendencias_json:
    get:
      tags: [Consultas]
      summary: Pendências em JSON cru
      security:
        - ApiTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/TokenParam"
        - $ref: "#/components/parameters/StateParam"
      responses:
        "200":
          description: JSON de pendências
  /api/pontualidade:
    get:
      tags: [Consultas]
      summary: Índices de pontualidade
      security:
        - ApiTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/TokenParam"
        - $ref: "#/components/parameters/StateParam"
      responses:
        "200":
          description: Relatório de pontualidade
  /api/perdas:
    get:
      tags: [Consultas]
      summary: Relatório de perdas e fraudes
      security:
        - ApiTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/TokenParam"
        - $ref: "#/components/parameters/StateParam"
      responses:
        "200":
          description: Relatório de perdas
  /api/c12_json:
    get:
      tags: [Consultas]
      summary: Metas C12
      security:
        - ApiTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/TokenParam"
        - $ref: "#/components/parameters/StateParam"
      responses:
        "200":
          description: JSON C12
  /api/cnl:
    get:
      tags: [Consultas]
      summary: Leituras CNL
      security:
        - ApiTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/TokenParam"
        - $ref: "#/components/parameters/StateParam"
      responses:
        "200":
          description: Relatório CNL
  /api/agent_telegram_id:
    get:
      tags: [Consultas]
      summary: Telegram ID do agente
      security:
        - ApiTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/TokenParam"
        - $ref: "#/components/parameters/StateParam"
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Telegram ID
  /api/justification_codes:
    post:
      tags: [Consultas]
      summary: Códigos de justificativa
      security:
        - ApiTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/TokenParam"
        - $ref: "#/components/parameters/StateParam"
        - name: id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Códigos de justificativa
  /api/justify_pending:
    post:
      tags: [Consultas]
      summary: Justificativa pendente em lote
      security:
        - ApiTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/TokenParam"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                autor:
                  type: string
                estado:
                  type: string
                quantidade:
                  type: integer
      responses:
        "201":
          description: Justificativa criada

  # ─── AGENTE ───────────────────────────────────────────────────────────
  /agent/agent_data:
    get:
      tags: [Agente]
      summary: Dados da sessão do agente
      security:
        - TelegramAuth: []
      responses:
        "200":
          description: Dados do agente
  /agent/profile:
    get:
      tags: [Agente]
      summary: Perfil completo do agente
      security:
        - TelegramAuth: []
      responses:
        "200":
          description: Perfil com badges, metas, estatísticas
          content:
        application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
  /agent/ceneduc:
    get:
      tags: [Agente, Treinamentos]
      summary: CenEduc do agente
      security:
        - TelegramAuth: []
      responses:
        "200":
          description: Cards CenEduc montados com covers e trilhas
  /agent/training/{id}/complete:
    post:
      tags: [Agente, Treinamentos]
      summary: Completar treinamento interativo
      security:
        - TelegramAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Treinamento concluído, badge concedida
  /agent/ceneduc/complete/{id}:
    post:
      tags: [Agente, Treinamentos]
      summary: Completar card CenEduc + badge
      security:
        - TelegramAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Card completado, badge concedida
  /agent/notifications:
    get:
      tags: [Agente, Notificações]
      summary: Notificações do agente
      security:
        - TelegramAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Lista paginada de notificações
  /agent/notifications/read:
    post:
      tags: [Agente, Notificações]
      summary: Marcar notificações como lidas
      security:
        - TelegramAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
      responses:
        "200":
          description: Notificações marcadas
  /agent/fcm-token:
    post:
      tags: [Agente, Notificações]
      summary: Registrar token FCM
      security:
        - TelegramAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Token registrado
  /agent/tracking/sync:
    post:
      tags: [Agente, Tracking]
      summary: Sincronizar dados de tracking
      security:
        - TelegramAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingSyncRequest"
      responses:
        "200":
          description: Tracking sincronizado

  # ─── SERVICE NOTES (AGENTE) ──────────────────────────────────────────
  /agent/service-notes/groups:
    get:
      tags: [Agente, Service Notes]
      summary: Lista grupos de serviço visíveis/creatable
      security:
        - TelegramAuth: []
      responses:
        "200":
          description: Lista de grupos
  /agent/service-notes/groups/visible:
    get:
      tags: [Agente, Service Notes]
      summary: Lista grupos públicos visíveis
      security:
        - TelegramAuth: []
      responses:
        "200":
          description: Grupos públicos
  /agent/service-notes/groups/{groupId}/notes:
    get:
      tags: [Agente, Service Notes]
      summary: Todas as notas de grupo público
      security:
        - TelegramAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notas do grupo
  /agent/service-notes/assigned:
    get:
      tags: [Agente, Service Notes]
      summary: Notas atribuídas ao agente
      security:
        - TelegramAuth: []
      responses:
        "200":
          description: Notas atribuídas
  /agent/service-notes/{id}:
    get:
      tags: [Agente, Service Notes]
      summary: Detalhes de uma nota
      security:
        - TelegramAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Nota com completion_config do grupo
  /agent/service-notes:
    post:
      tags: [Agente, Service Notes]
      summary: Criar nota (PENDENTE) em grupo permitido
      security:
        - TelegramAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                group_id:
                  type: integer
                title:
                  type: string
                description:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
      responses:
        "201":
          description: Nota criada
  /agent/service-notes/self-register:
    post:
      tags: [Agente, Service Notes]
      summary: Auto-registro de serviço (cria + conclui)
      security:
        - TelegramAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                group_id:
                  type: integer
                completionData:
                  type: object
      responses:
        "201":
          description: Nota criada e concluída
  /agent/service-notes/{id}/complete:
    post:
      tags: [Agente, Service Notes]
      summary: Concluir nota de serviço
      security:
        - TelegramAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                completionData:
                  type: object
      responses:
        "200":
          description: Nota concluída

  # ─── ADMIN ────────────────────────────────────────────────────────────
  /admin/user/login:
    post:
      tags: [Admin]
      summary: Login administrativo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                senha:
                  type: string
      responses:
        "200":
          description: Token JWT + dados do usuário
          content:
        application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/AdminUser"
  /admin/users_agents:
    get:
      tags: [Admin]
      summary: Lista agentes de campo
      security:
        - JwtAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: estado
          in: query
          description: "Estado(s), multi-valor separado por vírgula (ex: pi,ma)"
          schema:
            type: string
        - name: regional
          in: query
          description: Regional(is), multi-valor separado por vírgula
          schema:
            type: string
        - name: seccional
          in: query
          description: Seccional(is), multi-valor separado por vírgula
          schema:
            type: string
        - name: gestor
          in: query
          description: Gestor(es), multi-valor separado por vírgula
          schema:
            type: string
        - name: cargo
          in: query
          description: Cargo(s), multi-valor separado por vírgula
          schema:
            type: string
        - name: status
          in: query
          description: "Ativo/inativo: true,false (multi via status=true,false)"
          schema:
            type: string
        - name: situacao
          in: query
          description: "active, vocation, inactive, away (multi separado por vírgula)"
          schema:
            type: string
        - name: login_status
          in: query
          description: "online, offline, pending, none (multi separado por vírgula)"
          schema:
            type: string
      responses:
        "200":
          description: Lista de agentes
    post:
      tags: [Admin]
      summary: Cadastra agente de campo
      security:
        - JwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                matricula:
                  type: string
                nome:
                  type: string
                cargo:
                  type: string
                estado:
                  type: string
                regional:
                  type: string
                seccional:
                  type: string
      responses:
        "201":
          description: Agente cadastrado

  # ─── ADMIN: MÓDULO CONFIG ────────────────────────────────────────────
  /admin/config/etapas:
    get:
      tags: [Admin, Config]
      summary: Lista etapas de leitura
      security:
        - JwtAuth: []
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [pi, ma]
      responses:
        "200":
          description: Etapas do estado
          content:
        application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    etapa:
                      type: string
                    data:
                      type: string
    put:
      tags: [Admin, Config]
      summary: Atualiza data de etapa
      security:
        - JwtAuth: []
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [pi, ma]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                etapa:
                  type: string
                data:
                  type: string
      responses:
        "200":
          description: Etapa atualizada
  /admin/config/feriados:
    get:
      tags: [Admin, Config]
      summary: Lista feriados
      security:
        - JwtAuth: []
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [pi, ma]
      responses:
        "200":
          description: Feriados do estado
    post:
      tags: [Admin, Config]
      summary: Adiciona feriado
      security:
        - JwtAuth: []
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [pi, ma]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                description:
                  type: string
      responses:
        "201":
          description: Feriado criado
  /admin/config/feriados/{id}:
    delete:
      tags: [Admin, Config]
      summary: Remove feriado
      security:
        - JwtAuth: []
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [pi, ma]
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Feriado removido

  # ─── ADMIN: SECURITY REPORTS ─────────────────────────────────────────
  /admin/security_reports:
    get:
      tags: [Admin]
      summary: Lista relatórios de segurança
      security:
        - JwtAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      parameters:
        - name: estado
          in: query
          schema:
            type: string
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Relatórios paginados
          content:
        application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SecurityReport"
                  total:
                    type: integer
                  page:
                    type: integer
                  totalPages:
                    type: integer
    post:
      tags: [Admin]
      summary: Cria relatório de segurança
      security:
        - JwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                autor:
                  type: string
                motivo:
                  type: string
                observacao:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
                estado:
                  type: string
      responses:
        "201":
          description: Relatório criado
  /admin/security_reports/{id}:
    delete:
      tags: [Admin]
      summary: Remove relatório de segurança
      security:
        - JwtAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Relatório removido

  # ─── ADMIN: BADGES ───────────────────────────────────────────────────
  /admin/badge:
    get:
      tags: [Admin, Badges]
      summary: Lista badges
      security:
        - JwtAuth: []
      responses:
        "200":
          description: Lista de badges
    post:
      tags: [Admin, Badges]
      summary: Cria badge
      security:
        - JwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                image_url:
                  type: string
      responses:
        "201":
          description: Badge criada
  /admin/badge/{id}:
    get:
      tags: [Admin, Badges]
      summary: Detalhes da badge
      security:
        - JwtAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Badge
    put:
