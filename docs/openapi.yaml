          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Anotação excluída com sucesso
        "404":
          description: Não encontrada

  # ─── 2. LIMITES DE VELOCIDADE ──────────────────────────────────────────────
  /api/v1/speed-violations:
    get:
      tags: [Limites de Velocidade]
      summary: Consulta infrações de excesso de velocidade
      description: Retorna ocorrências de excesso de velocidade por período, agente ou raio geográfico.
      parameters:
        - name: estado
          in: query
          schema:
            type: string
        - name: date_from
          in: query
          schema:
            type: string
        - name: date_to
          in: query
          schema:
            type: string
        - name: agent_id
          in: query
          schema:
            type: string
        - name: regional
          in: query
          schema:
            type: string
        - name: seccional
          in: query
          schema:
            type: string
        - name: latitude
          in: query
          schema:
            type: number
        - name: longitude
          in: query
          schema:
            type: number
        - name: min_speed
          in: query
          schema:
            type: number
        - name: max_speed
          in: query
          schema:
            type: number
        - name: radius_km
          in: query
          schema:
            type: number
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Lista de infrações de velocidade

  # ─── 3. HEARTBEATS / RASTREAMENTO VIVO ─────────────────────────────────────
  /api/v1/heartbeats:
    get:
      tags: [Rastreamento & Heartbeats]
      summary: Consulta posições ativas dos agentes em tempo real
      description: |
        Retorna as posições dos agentes. Suporta 3 modos:
        - MODO ÚLTIMA POSIÇÃO: retorna apenas 1 ponto (o mais recente) por agente (use `latest_only=true`, `inactive_period` ou `active_period` ou não passe período).
        - MODO HISTÓRICO: Retorna a trilha de coordenadas no período (vários pontos). (passe `period` ou `date`).
      parameters:
        - name: estado
          in: query
          schema:
            type: string
        - name: agent_id
          in: query
          schema:
            type: string
        - name: period
          in: query
          schema:
            type: string
            enum: [now, 1h, 5h, 12h, 24h, all]
            description: Retorna todo o histórico de pontos dentro do período.
        - name: active_period
          in: query
          schema:
            type: string
            enum: [1h, 5h, 12h, 24h]
            description: Filtra apenas a última posição dos agentes que transmitiram no período informado (Ativos).
        - name: inactive_period
          in: query
          schema:
            type: string
            enum: [1h, 5h, 12h, 24h]
            description: Filtra apenas a última posição dos agentes que NÃO transmitem há pelo menos o tempo informado (Inativos).
        - name: latest_only
          in: query
          schema:
            type: boolean
            description: Retornar apenas a última posição conhecida de cada agente em vez do histórico completo.
        - name: date
          in: query
          schema:
            type: string
            description: Data histórica (YYYY-MM-DD)
        - name: regional
          in: query
          schema:
            type: string
        - name: seccional
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Lista de posições dos agentes

  # ─── 4. CHECKLISTS DE SEGURANÇA ────────────────────────────────────────────
  /api/v1/checklists:
    get:
      tags: [Checklists de Segurança]
      summary: Lista submissões de checklists de segurança
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: estado
          in: query
          schema:
            type: string
        - name: regional_id
          in: query
          schema:
            type: string
        - name: sectional_id
          in: query
          schema:
            type: string
        - name: agent_name
          in: query
          schema:
            type: string
        - name: date_from
          in: query
          schema:
            type: string
        - name: date_to
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [official, supplementary]
        - name: status
          in: query
          schema:
            type: string
            enum: [submitted, pending]
      responses:
        "200":
          description: Lista de checklists

  /api/v1/checklists/alerts:
    get:
      tags: [Checklists de Segurança]
      summary: Lista checklists com Alertas Críticos de Segurança
      description: Retorna exclusivamente checklists com não conformidades críticas.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: estado
          in: query
          schema:
            type: string
        - name: date_from
          in: query
          schema:
            type: string
        - name: date_to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Lista de alertas críticos

  /api/v1/checklists/non-conformities:
    get:
      tags: [Checklists de Segurança]
      summary: Detalhamento de Não Conformidades (Questões Reprovadas)
      description: Retorna todas as perguntas reprovadas nos checklists com fotos e observações.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: estado
          in: query
          schema:
            type: string
        - name: date_from
          in: query
          schema:
            type: string
        - name: date_to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Detalhamento de não conformidades

  /api/v1/checklists/summary:
    get:
      tags: [Checklists de Segurança]
      summary: Resumo Estatístico dos Checklists
      description: Retorna métricas consolidadas (total enviado, pendentes, taxa % de conformidade e divisão por regional).
      parameters:
        - name: date_from
          in: query
          schema:
            type: string
        - name: date_to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Resumo estatístico

  # ─── 5. AGENTES ────────────────────────────────────────────────────────────
  /api/v1/agents:
