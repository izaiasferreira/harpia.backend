openapi: "3.0.3"
info:
  title: Gedai External API
  description: |
    API Externa Unificada do ecossistema Gedai para consultas operacionais, reportes de segurança,
    infrações de velocidade, checklists, rastreamento ao vivo e integrações com BI.

    ## Autenticação via API Key

    Todos os endpoints desta documentação exigem um token de API ativo (gerado no painel administrativo `/control/api-keys`).
    Cada token possui o prefixo `gedai_` (exemplo: `gedai_a1b2c3d4e5f67890123456789abcdef0`).

    O token deve ser enviado no formato:
    1. **Header HTTP**: `Authorization: Bearer gedai_<token>`
  version: "2.0.0"
servers:
  - url: http://localhost:3040
    description: Servidor de Desenvolvimento
  - url: https://backgedai.eqtl.ceneged.com
    description: Servidor Oficial de Produção

security:
  - BearerAuth: []

tags:
  - name: Reportes de Segurança
    description: Consulta, criação, atualização e exclusão de riscos e reportes de segurança
  - name: Acidentes
    description: Consulta, criação, atualização e exclusão de acidentes operacionais
  - name: Anotações de Serviço
    description: Consulta, criação, atualização e exclusão de anotações de serviço, remanejamentos e coordenadas
  - name: Limites de Velocidade
    description: Ocorrências de excesso de velocidade registradas pelos dispositivos móveis
  - name: Rastreamento & Heartbeats
    description: Sinais ao vivo e posições recentes dos agentes de campo
  - name: Checklists de Segurança
    description: Submissões, alertas críticos, não conformidades e resumos estatísticos de checklists
  - name: Agentes
    description: Cadastro e status operacional dos colaboradores
  - name: Consultas Operacionais & BI
    description: Relatórios de pendências, pontualidade, leituras, CNL, C12, C16, E02, perdas e serviços
  - name: Integrações & Alertas
    description: Justificativas operacionais, recepção de webhooks do Telegram e disparo externo de notificações push

paths:
  # ─── 1. REPORTES DE SEGURANÇA ──────────────────────────────────────────────
  /api/v1/security-reports:
    get:
      tags: [Reportes de Segurança]
      summary: Consulta reportes de segurança (com busca por raio / perímetro)
      description: |
        Retorna a lista paginada de reportes de segurança cadastrados pelos agentes.
        Permite busca por perímetro enviando `latitude`, `longitude` e `radius_km` (ou `radius_m`).
        Retorna os pontos ordenados por distância com os campos `distance_km` e `distance_m`.
      parameters:
        - name: estado
          in: query
          schema:
            type: string
            enum: [PI, MA]
          description: Estado do colaborador
        - name: tipo
          in: query
          schema:
            type: string
          description: Categoria/motivo do risco
        - name: date_from
          in: query
          schema:
            type: string
          description: Data inicial (YYYY-MM-DD)
        - name: date_to
          in: query
          schema:
            type: string
          description: Data final (YYYY-MM-DD)
        - name: agent_id
          in: query
          schema:
            type: string
          description: Matrícula ou nome do agente autor
        - name: regional
          in: query
          schema:
            type: string
          description: Nome da regional
        - name: seccional
          in: query
          schema:
            type: string
          description: Nome da seccional
        - name: latitude
          in: query
          schema:
            type: number
          description: Latitude central para busca em raio
        - name: longitude
          in: query
          schema:
            type: number
          description: Longitude central para busca em raio
        - name: radius_km
          in: query
          schema:
            type: number
          description: Raio máximo em Quilômetros
        - name: radius_m
          in: query
          schema:
            type: number
          description: Raio máximo em Metros
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Lista de reportes de segurança
    post:
      tags: [Reportes de Segurança]
      summary: Cria um novo reporte de segurança
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [autor, motivo]
              properties:
                autor:
                  type: string
                  example: AG102030
                motivo:
                  type: string
                  example: Buraco na via
                observacao:
                  type: string
                foto:
                  type: string
                latitude:
                  type: string
                longitude:
                  type: string
                estado:
                  type: string
                  example: PI
                regional:
                  type: string
                seccional:
                  type: string
      responses:
        "201":
          description: Reporte criado com sucesso

  /api/v1/security-reports/{id}:
    get:
      tags: [Reportes de Segurança]
      summary: Obtém um reporte de segurança pelo ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Detalhes do reporte de segurança
        "404":
          description: Não encontrado
    put:
      tags: [Reportes de Segurança]
      summary: Atualiza um reporte de segurança
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                motivo:
                  type: string
                observacao:
                  type: string
                foto:
                  type: string
                latitude:
                  type: string
                longitude:
                  type: string
                estado:
                  type: string
                regional:
                  type: string
                seccional:
                  type: string
                resolvido:
                  type: boolean
                descricao_solucao:
                  type: string
                resolvido_por:
                  type: string
                resolvido_por_nome:
                  type: string
      responses:
        "200":
          description: Reporte atualizado com sucesso
        "404":
          description: Não encontrado
    delete:
      tags: [Reportes de Segurança]
      summary: Exclui um reporte de segurança
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reporte excluído com sucesso
        "404":
          description: Não encontrado

