      responses:
        "200":
          description: Logs de uso paginados

components:
  parameters:
    TokenParam:
      name: token
      in: query
      required: false
      schema:
        type: string
      description: |
        [DEPRECATED] Prefira usar o header `X-API-Token` ou `Authorization: Bearer`.
        Token de API gerenciável (prefixo `cenos_`).
    StateParam:
      name: state
      in: query
      schema:
        type: string
        enum: [pi, ma]
      description: Estado federativo

  securitySchemes:
    JwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Autenticação administrativa via JWT.
        Header: `Authorization: Bearer <token>`
        O token é obtido via `POST /admin/user/login`.
    TelegramAuth:
      type: apiKey
      in: header
      name: X-Telegram-Init-Data
      description: |
        Autenticação do agente via Telegram Mini App.
        Header: `X-Telegram-Init-Data: <initData>`
        O initData é validado via Telegram TMA.
    ApiTokenAuth:
      type: apiKey
      in: header
      name: X-API-Token
      description: |
        Token gerenciável via painel admin (/admin/api-tokens).
        Header: `X-API-Token: cenos_<hash>`
        Alternativo: `Authorization: Bearer cenos_<hash>`

  schemas:
    AdminUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        nome:
          type: string
        role:
          type: string
        estado:
          type: string

    AgentProfile:
      type: object
      properties:
        user:
          type: object
          properties:
            name:
              type: string
            role:
              type: string
            location:
              type: string
            photo:
              type: string
            stats:
              type: object
              properties:
                level:
                  type: number
                completionRate:
                  type: number
                fastResponses:
                  type: integer
                points:
                  type: integer
        goals:
          type: array
          items:
            type: object
        badges:
          type: array
          items:
            type: integer

    TrackingSyncRequest:
      type: object
      properties:
        points:
          type: array
          items:
            type: object
            properties:
              lat:
                type: number
              lng:
                type: number
              speed:
                type: number
              accuracy:
                type: number
              timestamp:
                type: integer
        violations:
          type: array
          items:
            type: object
        incidents:
          type: array
          items:
            type: object
        alerts:
          type: array
          items:
            type: object

    SecurityReport:
      type: object
      properties:
        id:
          type: integer
        autor:
          type: string
        motivo:
          type: string
        observacao:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        estado:
          type: string
        created_at:
          type: string
          format: date-time
        nome:
          type: string
        matricula:
          type: string

    ServiceGroup:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        completion_config:
          type: object
        allow_all_agents:
          type: boolean
        allowed_agents:
          type: array
          items:
            type: string
        allow_agent_creation:
          type: boolean
        created_at:
          type: string
          format: date-time

    ServiceGroupCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        completion_config:
          type: object
        allow_all_agents:
          type: boolean
        allowed_agents:
          type: array
          items:
            type: string
        allow_agent_creation:
          type: boolean

    CeneducCardCreate:
      type: object
      properties:
        card_type:
          type: string
          enum: [cover, train_item]
        section:
          type: string
          enum: [slider, banner]
        group_title:
          type: string
        state:
          type: string
        sort_order:
          type: integer
        badge_id:
          type: integer
          nullable: true
        data:
          type: object
          properties:
            title:
              type: string
            image:
              type: string
            description:
              type: string
            link:
              type: string
            resource_type:
              type: string
            resource_id:
              type: integer

    PublicNotifyRequest:
      type: object
      properties:
        sender:
          type: string
        to:
          type: string
        title:
          type: string
        body:
          type: string
        type:
          type: string
          enum: [success, warn, danger, info]
        method:
          type: array
          items:
            type: string
            enum: [telegram, push, priority, internal]

    PublicNotifyResponse:
      type: object
      properties:
        success:
          type: boolean
        id:
          type: integer
        results:
          type: object


