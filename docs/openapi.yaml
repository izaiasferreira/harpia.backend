  # ─── 7. INTEGRAÇÕES & ALERTAS ──────────────────────────────────────────────
  /api/v1/justify_pending:
    post:
      tags: [Integrações & Alertas]
      summary: Pré-cadastro de justificativa de pendência operacional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [autor, estado, quantidade]
              properties:
                autor:
                  type: string
                estado:
                  type: string
                quantidade:
                  type: integer
                tipo:
                  type: string
                unidade_leitura:
                  type: string
                instalacao:
                  type: string
                foto:
                  type: string
      responses:
        "201":
          description: Justificativa registrada

  /api/v1/telegram-webhook:
    post:
      tags: [Integrações & Alertas]
      summary: Webhook de recepção de eventos do Telegram Bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Webhook processado

  /api/v1/notify:
    post:
      tags: [Integrações & Alertas]
      summary: Disparo externo de notificações push e mensagens para colaboradores
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sender, to, body]
              properties:
                sender:
                  type: string
                  example: SistemaBI
                to:
                  type: array
                  items:
                    type: string
                  example: ["AG102030"]
                title:
                  type: string
                  example: Alerta Urgente
                body:
                  type: string
                  example: Favor verificar o serviço pendente na unidade L-04
                type:
                  type: string
                  enum: [success, warning, error, info]
                  default: success
                method:
                  type: array
                  items:
                    type: string
                    enum: [push, chat]
                  example: ["push", "chat"]
      responses:
        "200":
          description: Notificações enviadas

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: gedai_<hash>
      description: Token no header Authorization (ex. Bearer gedai_a1b2c3d4e5f67890123456789abcdef0)
