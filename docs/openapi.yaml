  # ─── ADMIN: DASHBOARD ────────────────────────────────────────────────
  /admin/dashboard:
    get:
      tags: [Admin]
      summary: Dashboard administrativo (SDUI) com indicadores filtrados por permissão
      security:
        - JwtAuth: []
      parameters:
        - in: query
          name: estado
          schema: { type: string }
          description: Filtra por estado (pi, ma)
        - in: query
          name: regional
          schema: { type: string }
          description: Filtra por regional (__VAZIO__ para vazio)
        - in: query
          name: seccional
          schema: { type: string }
          description: Filtra por seccional (__VAZIO__ para vazio)
        - in: query
          name: gestor
          schema: { type: string }
          description: Filtra por gestor (__VAZIO__ para vazio)
      responses:
        "200":
          description: Layout SDUI com widgets (Usuários Cadastrados, Logados Hoje, Agentes com Inventário, Status de Login, Itens de Inventário por Tipo, Agentes por Estado/Regional/Processo/Status/Situação)
          content:
            application/json:
              schema:
                type: object
                properties:
                  layout:
                    type: object
                    properties:
                      columns: { type: integer, example: 3 }
                      gap: { type: integer, example: 16 }
                      baseRowHeight: { type: integer, example: 165 }
                  widgets:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        type: { type: string, enum: [statCard, chartCard, bannerCarousel, alertCard] }
                        size:
                          type: object
                          properties:
                            colSpan: { type: integer }
                            rowSpan: { type: integer }
                        data: { type: object }
