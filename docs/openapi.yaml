  # ─── 1.2 ANOTAÇÕES DE SERVIÇO ──────────────────────────────────────────────
  /api/v1/service-annotations:
    get:
      tags: [Anotações de Serviço]
      summary: Consulta anotações de serviço
      parameters:
        - name: estado
          in: query
          schema:
            type: string
        - name: tipo
          in: query
          schema:
            type: string
        - name: identificacao_tipo
          in: query
          schema:
            type: string
        - name: identificacao_valor
          in: query
          schema:
            type: string
        - name: date_from
          in: query
          schema:
            type: string
        - name: date_to
          in: query
          schema:
            type: string
        - name: agent_id
          in: query
          schema:
            type: string
        - name: regional
          in: query
          schema:
            type: string
        - name: seccional
          in: query
          schema:
            type: string
        - name: resolvido
          in: query
          schema:
            type: boolean
        - name: arquivada
          in: query
          schema:
            type: boolean
        - name: latitude
          in: query
          schema:
            type: number
        - name: longitude
          in: query
          schema:
            type: number
        - name: radius_km
          in: query
          schema:
            type: number
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Lista de anotações de serviço
    post:
      tags: [Anotações de Serviço]
      summary: Cria uma nova anotação de serviço
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [autor, tipo, descricao]
              properties:
                autor:
                  type: string
                  example: AG102030
                tipo:
                  type: string
                  enum: [Remanejamento, Anotação, Coordenada]
                  example: Anotação
                identificacao_tipo:
                  type: string
                  enum: [Medidor, Instalação, Unidade Consumidora]
                identificacao_valor:
                  type: string
                descricao:
                  type: string
                  example: Trocar medidor da unidade
                latitude:
                  type: string
                longitude:
                  type: string
                foto:
                  type: string
                estado:
                  type: string
                regional:
                  type: string
                seccional:
                  type: string
                expires_at:
                  type: string
      responses:
        "201":
          description: Anotação criada com sucesso

  /api/v1/service-annotations/{id}:
    get:
      tags: [Anotações de Serviço]
      summary: Obtém uma anotação de serviço pelo ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Detalhes da anotação de serviço
        "404":
          description: Não encontrada
    put:
      tags: [Anotações de Serviço]
      summary: Atualiza uma anotação de serviço
      parameters:
