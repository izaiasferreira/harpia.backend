openapi: "3.0.3"
info:
  title: Gedai External API
  description: |
    API Externa Unificada do ecossistema Gedai para consultas operacionais, reportes de segurança,
    infrações de velocidade, checklists, rastreamento ao vivo e integrações com BI.

    ## Autenticação via API Key

    Todos os endpoints desta documentação exigem um token de API ativo (gerado no painel administrativo `/control/api-keys`).
    Cada token possui o prefixo `gedai_` (exemplo: `gedai_a1b2c3d4e5f67890123456789abcdef0`).

    O token pode ser enviado em qualquer uma das três formas:
    1. **Header HTTP**: `X-API-Token: gedai_<token>` (Recomendado)
    2. **Header HTTP**: `Authorization: Bearer gedai_<token>`
    3. **Query Parameter**: `?token=gedai_<token>`
  version: "2.0.0"
servers:
  - url: http://localhost:3040
    description: Servidor de Desenvolvimento
  - url: https://backgedai.eqtl.ceneged.com
    description: Servidor Oficial de Produção

security:
  - ApiKeyHeader: []
  - BearerAuth: []
  - ApiKeyQuery: []

tags:
  - name: Reportes de Segurança
    description: Consulta de riscos e reportes de segurança com filtro de raio/perímetro geográfico
  - name: Limites de Velocidade
    description: Ocorrências de excesso de velocidade registradas pelos dispositivos móveis
  - name: Rastreamento & Heartbeats
    description: Sinais ao vivo e posições recentes dos agentes de campo
  - name: Checklists de Segurança
    description: Submissões, alertas críticos, não conformidades e resumos estatísticos de checklists
  - name: Agentes
    description: Cadastro e status operacional dos colaboradores
  - name: Consultas Operacionais & BI
    description: Relatórios de pendências, pontualidade, leituras, CNL, C12, C16, E02, perdas e serviços
  - name: Integrações & Alertas
    description: Justificativas operacionais, recepção de webhooks do Telegram e disparo externo de notificações push

paths:
  # ─── 1. REPORTES DE SEGURANÇA ──────────────────────────────────────────────
  /api/v1/security-reports:
    get:
      tags: [Reportes de Segurança]
      summary: Consulta reportes de segurança (com busca por raio / perímetro)
      description: |
        Retorna a lista paginada de reportes de segurança cadastrados pelos agentes.
        Permite busca por perímetro enviando `latitude`, `longitude` e `radius_km` (ou `radius_m`).
        Retorna os pontos ordenados por distância com os campos `distance_km` e `distance_m`.
      parameters:
        - name: estado
          in: query
          schema:
            type: string
            enum: [PI, MA]
          description: Estado do colaborador
        - name: tipo
          in: query
          schema:
            type: string
          description: Categoria/motivo do risco
        - name: date_from
          in: query
          schema:
            type: string
          description: Data inicial (YYYY-MM-DD)
        - name: date_to
          in: query
          schema:
            type: string
          description: Data final (YYYY-MM-DD)
        - name: agent_id
          in: query
          schema:
            type: string
          description: Matrícula ou nome do agente autor
        - name: regional
          in: query
          schema:
            type: string
          description: Nome da regional
        - name: seccional
          in: query
          schema:
            type: string
          description: Nome da seccional
        - name: latitude
          in: query
          schema:
            type: number
          description: Latitude central para busca em raio
        - name: longitude
          in: query
          schema:
            type: number
          description: Longitude central para busca em raio
        - name: radius_km
          in: query
          schema:
            type: number
          description: Raio máximo em Quilômetros
        - name: radius_m
          in: query
          schema:
            type: number
          description: Raio máximo em Metros
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Lista de reportes de segurança

  # ─── 2. LIMITES DE VELOCIDADE ──────────────────────────────────────────────
  /api/v1/speed-violations:
    get:
      tags: [Limites de Velocidade]
      summary: Consulta infrações de excesso de velocidade
      description: Retorna ocorrências de excesso de velocidade por período, agente ou raio geográfico.
      parameters:
        - name: estado
          in: query
          schema:
            type: string
        - name: date_from
          in: query
          schema:
            type: string
        - name: date_to
          in: query
          schema:
            type: string
        - name: agent_id
          in: query
          schema:
            type: string
        - name: regional
          in: query
          schema:
            type: string
        - name: seccional
          in: query
          schema:
            type: string
        - name: latitude
          in: query
          schema:
            type: number
        - name: longitude
          in: query
          schema:
            type: number
        - name: radius_km
          in: query
          schema:
            type: number
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Lista de infrações de velocidade

  # ─── 3. HEARTBEATS / RASTREAMENTO VIVO ─────────────────────────────────────
  /api/v1/heartbeats:
    get:
      tags: [Rastreamento & Heartbeats]
      summary: Consulta posições ativas dos agentes em tempo real
      description: |
        Retorna o último sinal GPS dos agentes.
        Suporta o parâmetro `period`: `now` (últimos 15 min), `1h`, `5h`, `12h`, `24h` ou `all`.
      parameters:
        - name: estado
          in: query
          schema:
            type: string
        - name: agent_id
          in: query
          schema:
            type: string
        - name: period
          in: query
          schema:
            type: string
            enum: [now, 1h, 5h, 12h, 24h, all]
            default: now
        - name: date
          in: query
          schema:
            type: string
            description: Data histórica (YYYY-MM-DD)
        - name: regional
          in: query
          schema:
            type: string
        - name: seccional
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Lista de posições dos agentes

  # ─── 4. CHECKLISTS DE SEGURANÇA ────────────────────────────────────────────
  /api/v1/checklists:
    get:
      tags: [Checklists de Segurança]
      summary: Lista submissões de checklists de segurança
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: estado
          in: query
          schema:
            type: string
        - name: regional_id
          in: query
          schema:
            type: string
        - name: sectional_id
          in: query
          schema:
            type: string
        - name: agent_name
          in: query
          schema:
            type: string
        - name: date_from
          in: query
          schema:
            type: string
        - name: date_to
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [official, supplementary]
        - name: status
          in: query
          schema:
            type: string
            enum: [submitted, pending]
      responses:
        "200":
          description: Lista de checklists

  /api/v1/checklists/alerts:
    get:
      tags: [Checklists de Segurança]
      summary: Lista checklists com Alertas Críticos de Segurança
      description: Retorna exclusivamente checklists com não conformidades críticas.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: estado
          in: query
          schema:
            type: string
        - name: date_from
          in: query
          schema:
            type: string
        - name: date_to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Lista de alertas críticos

  /api/v1/checklists/non-conformities:
    get:
      tags: [Checklists de Segurança]
      summary: Detalhamento de Não Conformidades (Questões Reprovadas)
      description: Retorna todas as perguntas reprovadas nos checklists com fotos e observações.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: estado
          in: query
          schema:
            type: string
        - name: date_from
          in: query
          schema:
            type: string
        - name: date_to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Detalhamento de não conformidades

  /api/v1/checklists/summary:
    get:
      tags: [Checklists de Segurança]
      summary: Resumo Estatístico dos Checklists
      description: Retorna métricas consolidadas (total enviado, pendentes, taxa % de conformidade e divisão por regional).
      parameters:
        - name: date_from
          in: query
          schema:
            type: string
        - name: date_to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Resumo estatístico

  # ─── 5. AGENTES ────────────────────────────────────────────────────────────
  /api/v1/agents:
    get:
      tags: [Agentes]
      summary: Consulta cadastro e status operacional dos colaboradores
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: estado
          in: query
          schema:
            type: string
        - name: regional
          in: query
          schema:
            type: string
        - name: seccional
          in: query
          schema:
            type: string
        - name: processo
          in: query
          schema:
            type: string
        - name: cargo
          in: query
          schema:
            type: string
        - name: gestor
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: boolean
        - name: situacao
          in: query
          schema:
            type: string
        - name: login_status
          in: query
          schema:
            type: string
            enum: [online, offline, pending, none]
      responses:
        "200":
          description: Lista de colaboradores cadastrados

  # ─── 6. CONSULTAS OPERACIONAIS & BI ───────────────────────────────────────
  /api/v1/last_update:
    get:
      tags: [Consultas Operacionais & BI]
      summary: Data/hora da última sincronização por estado
      parameters:
        - name: state
          in: query
          schema:
            type: string
            default: pi
      responses:
        "200":
          description: Última atualização

  /api/v1/pendencias:
    get:
      tags: [Consultas Operacionais & BI]
      summary: Resumo de pendências operacionais por estado e regional
      parameters:
        - name: state
          in: query
          schema:
            type: string
            default: pi
        - name: regional
          in: query
          schema:
            type: string
            default: all
      responses:
        "200":
          description: Resumo de pendências

  /api/v1/pendencias_json:
    get:
      tags: [Consultas Operacionais & BI]
      summary: Dados de pendências em formato JSON
      parameters:
        - name: state
          in: query
          schema:
            type: string
            default: pi
        - name: regional
          in: query
          schema:
            type: string
            default: all
      responses:
        "200":
          description: Dados de pendências em JSON

  /api/v1/pontualidade:
    get:
      tags: [Consultas Operacionais & BI]
      summary: Indicadores de pontualidade da equipe
      parameters:
        - name: state
          in: query
          schema:
            type: string
            default: pi
        - name: regional
          in: query
          schema:
            type: string
            default: all
      responses:
        "200":
          description: Indicadores de pontualidade

  /api/v1/pontualidade_json:
    get:
      tags: [Consultas Operacionais & BI]
      summary: Relatório detalhado de pontualidade em JSON
      parameters:
        - name: state
          in: query
          schema:
            type: string
            default: pi
        - name: regional
          in: query
          schema:
            type: string
            default: all
      responses:
        "200":
          description: Pontualidade em JSON

  /api/v1/cnl:
    get:
      tags: [Consultas Operacionais & BI]
      summary: Serviços da classe CNL (Corte e Religação)
      parameters:
        - name: state
          in: query
          schema:
            type: string
            default: pi
        - name: regional
          in: query
          schema:
            type: string
            default: all
        - name: dateinit
          in: query
          schema:
            type: string
        - name: dateend
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Serviços CNL

  /api/v1/cnl_to_lido_json:
    get:
      tags: [Consultas Operacionais & BI]
      summary: Serviços de CNL convertidos em leitura
      parameters:
        - name: state
          in: query
          schema:
            type: string
            default: pi
        - name: regional
          in: query
          schema:
            type: string
            default: all
        - name: dateinit
          in: query
          schema:
            type: string
      responses:
        "200":
          description: CNL convertidos em leitura

  /api/v1/first_cnl_json:
    get:
      tags: [Consultas Operacionais & BI]
      summary: Primeiro serviço CNL do dia
      parameters:
        - name: state
          in: query
          schema:
            type: string
            default: pi
        - name: regional
          in: query
          schema:
            type: string
            default: all
        - name: dateinit
          in: query
          schema:
            type: string
        - name: dateend
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Primeiro CNL do dia

  /api/v1/c12_json:
    get:
      tags: [Consultas Operacionais & BI]
      summary: Dados da classe C12 (Inspeção e Medição) em JSON
      parameters:
        - name: state
          in: query
          schema:
            type: string
            default: pi
        - name: regional
          in: query
          schema:
            type: string
            default: all
        - name: dateinit
          in: query
          schema:
            type: string
        - name: dateend
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Relatório C12 em JSON

  /api/v1/c12_to_lido_json:
    get:
      tags: [Consultas Operacionais & BI]
      summary: Serviços C12 lidos em JSON
      parameters:
        - name: state
          in: query
          schema:
            type: string
            default: pi
        - name: regional
          in: query
          schema:
            type: string
            default: all
        - name: dateinit
          in: query
          schema:
            type: string
      responses:
        "200":
          description: C12 lidos em JSON

  /api/v1/first_c12_json:
    get:
      tags: [Consultas Operacionais & BI]
      summary: Primeiro serviço C12 executado
      parameters:
        - name: state
          in: query
          schema:
            type: string
            default: pi
        - name: regional
          in: query
          schema:
            type: string
            default: all
        - name: dateinit
          in: query
          schema:
            type: string
        - name: dateend
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Primeiro C12 executado

  /api/v1/fast_c12_json:
    get:
      tags: [Consultas Operacionais & BI]
      summary: Atendimentos rápidos C12
      parameters:
        - name: state
          in: query
          schema:
            type: string
            default: pi
        - name: regional
          in: query
          schema:
            type: string
            default: all
        - name: dateinit
          in: query
          schema:
            type: string
        - name: dateend
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Atendimentos rápidos C12

  /api/v1/licacao_nova_c12_json:
    get:
      tags: [Consultas Operacionais & BI]
      summary: Ligações novas C12
      parameters:
        - name: state
          in: query
          schema:
            type: string
            default: pi
        - name: regional
          in: query
          schema:
            type: string
            default: all
        - name: dateinit
          in: query
          schema:
            type: string
        - name: dateend
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Ligações novas C12

  /api/v1/e02_json:
    get:
      tags: [Consultas Operacionais & BI]
      summary: Relatório de emergência/manutenção E02 em JSON
      parameters:
        - name: state
          in: query
          schema:
            type: string
            default: pi
        - name: regional
          in: query
          schema:
            type: string
            default: all
        - name: dateinit
          in: query
          schema:
            type: string
        - name: dateend
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Relatório E02 em JSON

  /api/v1/c16_json:
    get:
      tags: [Consultas Operacionais & BI]
      summary: Relatório de serviços C16 em JSON
      parameters:
        - name: state
          in: query
          schema:
            type: string
            default: pi
        - name: regional
          in: query
          schema:
            type: string
            default: all
        - name: dateinit
          in: query
          schema:
            type: string
        - name: dateend
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Relatório C16 em JSON

  /api/v1/perdas:
    get:
      tags: [Consultas Operacionais & BI]
      summary: Resumo de perdas de energia
      parameters:
        - name: state
          in: query
          schema:
            type: string
            default: pi
        - name: regional
          in: query
          schema:
            type: string
            default: all
        - name: dateinit
          in: query
          schema:
            type: string
        - name: dateend
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Resumo de perdas

  /api/v1/perdas_json:
    get:
      tags: [Consultas Operacionais & BI]
      summary: Dados de perdas de energia em JSON
      parameters:
        - name: state
          in: query
          schema:
            type: string
            default: pi
        - name: regional
          in: query
          schema:
            type: string
            default: all
        - name: dateinit
          in: query
          schema:
            type: string
        - name: dateend
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Dados de perdas em JSON

  /api/v1/not_start_services:
    get:
      tags: [Consultas Operacionais & BI]
      summary: Serviços pendentes de início por regional
      parameters:
        - name: state
          in: query
          schema:
            type: string
            default: pi
      responses:
        "200":
          description: Serviços não iniciados

  /api/v1/completed_services:
    get:
      tags: [Consultas Operacionais & BI]
      summary: Lista de serviços concluídos hoje
      parameters:
        - name: state
          in: query
          schema:
            type: string
            default: pi
      responses:
        "200":
          description: Lista de serviços concluídos

  /api/v1/incompleted_services:
    get:
      tags: [Consultas Operacionais & BI]
      summary: Lista de serviços incompletos/pendentes hoje
      parameters:
        - name: state
          in: query
          schema:
            type: string
            default: pi
      responses:
        "200":
          description: Lista de serviços pendentes

  /api/v1/agent_telegram_id:
    get:
      tags: [Consultas Operacionais & BI]
      summary: Consulta de Telegram ID associado à matrícula do agente
      parameters:
        - name: state
          in: query
          schema:
            type: string
            default: pi
        - name: id
          in: query
          schema:
            type: string
          description: Matrícula do colaborador
      responses:
        "200":
          description: Telegram ID do agente

  /api/v1/justification_codes:
    post:
      tags: [Consultas Operacionais & BI]
      summary: Envio/atualização de códigos de justificativa
      parameters:
        - name: state
          in: query
          schema:
            type: string
            default: pi
        - name: id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Resultado da atualização

  # ─── 7. INTEGRAÇÕES & ALERTAS ──────────────────────────────────────────────
  /api/v1/justify_pending:
    post:
      tags: [Integrações & Alertas]
      summary: Pré-cadastro de justificativa de pendência operacional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [autor, estado, quantidade]
              properties:
                autor:
                  type: string
                estado:
                  type: string
                quantidade:
                  type: integer
                tipo:
                  type: string
                unidade_leitura:
                  type: string
                instalacao:
                  type: string
                foto:
                  type: string
      responses:
        "201":
          description: Justificativa registrada

  /api/v1/telegram-webhook:
    post:
      tags: [Integrações & Alertas]
      summary: Webhook de recepção de eventos do Telegram Bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Webhook processado

  /api/v1/notify:
    post:
      tags: [Integrações & Alertas]
      summary: Disparo externo de notificações push e mensagens para colaboradores
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sender, to, body]
              properties:
                sender:
                  type: string
                  example: SistemaBI
                to:
                  type: array
                  items:
                    type: string
                  example: ["AG102030"]
                title:
                  type: string
                  example: Alerta Urgente
                body:
                  type: string
                  example: Favor verificar o serviço pendente na unidade L-04
                type:
                  type: string
                  enum: [success, warning, error, info]
                  default: success
                method:
                  type: array
                  items:
                    type: string
                    enum: [push, chat]
                  example: ["push", "chat"]
      responses:
        "200":
          description: Notificações enviadas

components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Token
      description: Token da API com prefixo 'gedai_' (ex. gedai_a1b2c3d4e5f67890123456789abcdef0)
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: gedai_<hash>
      description: Token no header Authorization (ex. Bearer gedai_a1b2c3d4e5f67890123456789abcdef0)
    ApiKeyQuery:
      type: apiKey
      in: query
      name: token
      description: Token via query parameter na URL (?token=gedai_...)
