            schema:
              type: object
              properties:
                tipo:
                  type: string
                identificacao_tipo:
                  type: string
                identificacao_valor:
                  type: string
                descricao:
                  type: string
                latitude:
                  type: string
                longitude:
                  type: string
                foto:
                  type: string
                estado:
                  type: string
                regional:
                  type: string
                seccional:
                  type: string
                expires_at:
                  type: string
                arquivada:
                  type: boolean
                resolvido:
                  type: boolean
                descricao_solucao:
                  type: string
                resolvido_por:
